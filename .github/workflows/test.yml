# Runs the unit tests on an iPhone simulator for every push and pull request to main.
# The repo is private: GitHub's free plan has 2,000 minutes a month and macOS minutes count 10x,
# so this only runs when app or test code changes, and a newer push cancels an older run.
name: Tests

on:
  push:
    branches: [main]
    paths: ["DailyBudget/**", "DailyBudgetTests/**", "DailyBudgetWidget/**", "project.yml", ".github/workflows/test.yml"]
  pull_request:
    branches: [main]
    paths: ["DailyBudget/**", "DailyBudgetTests/**", "DailyBudgetWidget/**", "project.yml", ".github/workflows/test.yml"]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Pick an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for runtime, ds in devices.items() if "iOS" in runtime
                     for d in ds if d["name"].startswith("iPhone")))')
          echo "SIMULATOR=$UDID" >> "$GITHUB_ENV"

      - name: Run tests
        run: |
          set -o pipefail
          xcodebuild test -scheme DailyBudget -destination "id=$SIMULATOR" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tail -60
