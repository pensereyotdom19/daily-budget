name: DailyBudget
options:
  bundleIdPrefix: com.pensereyotdom19
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  DailyBudget:
    type: application
    platform: iOS
    sources:
      - DailyBudget
    dependencies:
      - target: DailyBudgetWidget
    entitlements:
      path: DailyBudget/DailyBudget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.pensereyotdom19.dailybudget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pensereyotdom19.dailybudget
        INFOPLIST_KEY_CFBundleDisplayName: Daily Budget
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSFaceIDUsageDescription: Face ID keeps your budget private.
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 7K4A6SZT3P
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  DailyBudgetWidget:
    type: app-extension
    platform: iOS
    sources:
      - DailyBudgetWidget
      - DailyBudget/Shared
      - DailyBudget/Logic/BudgetCalculator.swift
      - DailyBudget/Logic/MonthKey.swift
      - DailyBudget/Localizable.xcstrings
    info:
      path: DailyBudgetWidget/Info.plist
      properties:
        CFBundleDisplayName: Daily Budget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: DailyBudgetWidget/DailyBudgetWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.pensereyotdom19.dailybudget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pensereyotdom19.dailybudget.widget
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 7K4A6SZT3P
  DailyBudgetTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - DailyBudgetTests
    dependencies:
      - target: DailyBudget
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.pensereyotdom19.dailybudget.tests
        DEVELOPMENT_TEAM: 7K4A6SZT3P
schemes:
  DailyBudget:
    build:
      targets:
        DailyBudget: all
    test:
      targets:
        - DailyBudgetTests
