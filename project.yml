name: DailyBudget
options:
  bundleIdPrefix: com.pensereyotdom19
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  DailyBudget:
    type: application
    platform: iOS
    sources:
      - DailyBudget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pensereyotdom19.dailybudget
        INFOPLIST_KEY_CFBundleDisplayName: Daily Budget
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 7K4A6SZT3P
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  DailyBudgetTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - DailyBudgetTests
    dependencies:
      - target: DailyBudget
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.pensereyotdom19.dailybudget.tests
schemes:
  DailyBudget:
    build:
      targets:
        DailyBudget: all
    test:
      targets:
        - DailyBudgetTests
